<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Jot it down before you forget it.</p>
  </header>

  <main>
    <section id="add-section">
      <h2>Add a note</h2>
      <form id="note-form">
        <label for="note-input">Note</label>
        <input type="text" id="note-input" placeholder="Type your note here">

        <label for="note-category">Category</label>
        <select id="note-category">
          <option value="personal">Personal</option>
          <option value="work">Work</option>
          <option value="study">Study</option>
        </select>

        <button type="submit">Add Note</button>
      </form>
      <p id="error-message"></p>
    </section>

    <section id="notes-section">
      <h2>Your notes</h2>
      <form id="search-form" role="search">
        <input type="search" id="search-input" placeholder="Search notes" aria-label="Search notes">
        <button type="submit">Search</button>
      </form>
      <p id="note-count"></p>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>QuickNotes - my first web app</p>
  </footer>
  
<script src="script.js" defer></script>
</body>
</html>
